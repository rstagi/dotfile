# Loop Engineering — model chains and knobs (sourced by loop-runner.sh)
# Leg grammar: engine:model[+fallback[,fallback2]]
#   - Legs track the LATEST model of each family, so new releases need no edit here:
#     claude legs use the CLI's native aliases (opus, sonnet, fable, haiku); codex legs use
#     `@<family>` (sol, astra, terra, luna), which loop-runner resolves at launch to the
#     newest listed gpt-<version>-<family> in `codex debug models`. meta.json records the
#     concrete model that ran. Pin a full name (e.g. claude-opus-5-5, gpt-6-sol) to freeze one.
#   - claude "+x,y" becomes --fallback-model x,y (native, retries primary each turn)
#   - codex legs: fallback across engines is loop-runner's job (next leg)

CHAIN_TASK=("codex:@sol" "claude:sonnet")
# Jev may select this named profile only. It remains a fixed, reviewed chain and
# falls through to the established task chain on API/usage failure.
CHAIN_TASK_LIGHT=("codex:@terra" "${CHAIN_TASK[@]}")
LOOP_TASK_DEFAULT_PROFILE=default
LOOP_TASK_LIGHT_PROFILE=light
CHAIN_ESCALATE=("claude:fable+opus")

# Effort per role (low|medium|high|xhigh|max|ultra). Passed per leg: claude --effort <e>
# (no ultra → clamped to max), codex -c model_reasoning_effort="<e>".
EFFORT_TASK=high          # phase runners (CHAIN_TASK / CHAIN_TASK_LIGHT)
EFFORT_ESCALATE=high      # L3 escalation + merge-conflict resolution
EFFORT_ORCHESTRATE=high   # SUB orchestrator (loop-orchestrator.sh)

# PR review tiers (`[review: shallow|medium|max]` + `[rounds: N]` on the review phase).
# Each round: adversaries review independently (ADV_A [+ ADV_B]); FIX remediates between
# rounds; FINAL reconciles the last round and posts the only GitHub verdict.
LOOP_REVIEW_TIER_DEFAULT=medium
LOOP_REVIEW_ROUNDS_SHALLOW=1
LOOP_REVIEW_ROUNDS_MEDIUM=3
LOOP_REVIEW_ROUNDS_MAX=3
LOOP_REVIEW_ROUNDS_CAP=5
# shallow — one Opus reviewer, Sonnet fixes (no ADV_B)
CHAIN_REVIEW_SHALLOW_ADV_A=("claude:opus");  EFFORT_REVIEW_SHALLOW_ADV_A=high
CHAIN_REVIEW_SHALLOW_FIX=("claude:sonnet");  EFFORT_REVIEW_SHALLOW_FIX=medium
CHAIN_REVIEW_SHALLOW_FINAL=("claude:opus");  EFFORT_REVIEW_SHALLOW_FINAL=high
# medium (default) — Sol + Opus adversaries, Opus fixes, Opus verdict
CHAIN_REVIEW_MEDIUM_ADV_A=("codex:@sol");    EFFORT_REVIEW_MEDIUM_ADV_A=xhigh
CHAIN_REVIEW_MEDIUM_ADV_B=("claude:opus");   EFFORT_REVIEW_MEDIUM_ADV_B=xhigh
CHAIN_REVIEW_MEDIUM_FIX=("claude:opus");     EFFORT_REVIEW_MEDIUM_FIX=medium
CHAIN_REVIEW_MEDIUM_FINAL=("claude:opus");   EFFORT_REVIEW_MEDIUM_FINAL=xhigh
# max — Astra + Fable adversaries, Opus fixes, Opus verdict
CHAIN_REVIEW_MAX_ADV_A=("codex:@astra");     EFFORT_REVIEW_MAX_ADV_A=ultra
CHAIN_REVIEW_MAX_ADV_B=("claude:fable");     EFFORT_REVIEW_MAX_ADV_B=max
CHAIN_REVIEW_MAX_FIX=("claude:opus");        EFFORT_REVIEW_MAX_FIX=medium
CHAIN_REVIEW_MAX_FINAL=("claude:opus");      EFFORT_REVIEW_MAX_FINAL=max

# Extra args passed verbatim to every leg of that engine (effort lives in EFFORT_* above).
CODEX_EXTRA_ARGS=()
CLAUDE_EXTRA_ARGS=()

# Jev decision client. Advice-only shadow mode is the safe credentialed default;
# active policy remains opt-in and is allowlisted by each later integration point.
# The local key file stays outside git and is read by loop-jev.mjs, not exported.
LOOP_JEV_KEY_FILE="${LOOP_JEV_KEY_FILE:-${0:A:h}/.loop-secrets/typesafe-api-key}"
# Keep implicit off distinct from explicit off when supervisors source this again.
if [[ -z "${LOOP_JEV_MODE:-}" || "${LOOP_JEV_MODE_EXPLICIT:-}" == 0 ]]; then
  LOOP_JEV_MODE_EXPLICIT=0
  [[ -n "${TYPESAFE_API_KEY:-}" || -s "$LOOP_JEV_KEY_FILE" ]] && LOOP_JEV_MODE=shadow || LOOP_JEV_MODE=off
else
  LOOP_JEV_MODE_EXPLICIT="${LOOP_JEV_MODE_EXPLICIT:-1}"
fi
case "$LOOP_JEV_MODE" in
  off|shadow|active) ;;
  *) LOOP_JEV_MODE=off ;;
esac
LOOP_JEV_ROUTE_MIN_CONFIDENCE="${LOOP_JEV_ROUTE_MIN_CONFIDENCE:-0.8}"
LOOP_JEV_QUESTION_MIN_CONFIDENCE="${LOOP_JEV_QUESTION_MIN_CONFIDENCE:-0.8}"
LOOP_JEV_MERGE_RISK_MIN_CONFIDENCE="${LOOP_JEV_MERGE_RISK_MIN_CONFIDENCE:-0.8}"
LOOP_JEV_TIMEOUT_MS="${LOOP_JEV_TIMEOUT_MS:-5000}"
export LOOP_JEV_KEY_FILE LOOP_JEV_MODE LOOP_JEV_MODE_EXPLICIT LOOP_JEV_ROUTE_MIN_CONFIDENCE LOOP_JEV_QUESTION_MIN_CONFIDENCE
export LOOP_JEV_MERGE_RISK_MIN_CONFIDENCE LOOP_JEV_TIMEOUT_MS
export LOOP_TASK_DEFAULT_PROFILE LOOP_TASK_LIGHT_PROFILE

LOOP_BUDGET_USD=15          # per attempt, claude legs only (codex has no budget flag)
LOOP_CHECKPOINT_SEC=1800    # 30m ceiling for one work/review attempt across model legs/retries
LOOP_TIMEOUT_TASK=1800      # 30m
LOOP_TIMEOUT_ESCALATE=1800  # 30m
LOOP_TIMEOUT_REVIEW=1800    # 30m
LOOP_TIMEOUT_REMEDIATE=1800 # 30m
LOOP_MAX_PARALLEL=3         # concurrent lanes (enforced by the orchestrator)

# Two-tier self-recycling orchestrator (loop-orchestrator.sh spawns disposable headless SUB
# instances; each self-measures its own context and recycles at a safe boundary). Trigger is
# absolute tokens, no hard-kill — see loop-protocol.md § Two-tier orchestration.
CHAIN_ORCHESTRATE=("claude:opus")  # SUB instances: latest Opus
LOOP_ORCH_RECYCLE_TOKENS=150000  # SUB soft-handoff: recycle at the next safe boundary past this
LOOP_ORCH_CEILING_TOKENS=200000  # informational target ceiling (keeps the main chat under this)
LOOP_ORCH_BUDGET_USD=15          # per SUB instance (claude legs only)
LOOP_ORCH_STALL_SEC=1500         # SUB transcript mtime stale → kill pid tree + crash-respawn (25m)
LOOP_ORCH_MAX_RESPAWN=3          # consecutive-crash respawn cap, then notify + give up
LOOP_ORCH_CTX_WINDOW=1000000     # Opus 5.5 context window — UI occupancy % ONLY (trigger is absolute)
