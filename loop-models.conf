# Loop Engineering — model chains and knobs (sourced by loop-runner.sh)
# Leg grammar: engine:model[+fallback[,fallback2]]
#   - claude legs accept aliases or full model names; review/orchestration roles are
#     version-pinned so independent runs stay reproducible; "+x,y" becomes
#     --fallback-model x,y (native, retries primary each turn)
#   - codex legs: fallback across engines is loop-runner's job (next leg)

CHAIN_TASK=("codex:gpt-6-sol" "claude:claude-sonnet-5")
# Jev may select this named profile only. It remains a fixed, reviewed chain and
# falls through to the established task chain on API/usage failure.
CHAIN_TASK_LIGHT=("codex:gpt-5.6-terra" "${CHAIN_TASK[@]}")
LOOP_TASK_DEFAULT_PROFILE=default
LOOP_TASK_LIGHT_PROFILE=light
CHAIN_ESCALATE=("claude:fable+opus")
CHAIN_REVIEW_FABLE=("claude:claude-fable-5-1")
CHAIN_REVIEW_ASTRA=("codex:gpt-6-astra")
CHAIN_REVIEW_FIX=("claude:claude-opus-5")
CHAIN_REVIEW_FINAL=("claude:claude-opus-5")

# High effort for both engines. Add task-delegation config keys here when enabled
# (passed verbatim to every leg for that engine).
CODEX_EXTRA_ARGS=(-c 'model_reasoning_effort="high"')
CLAUDE_EXTRA_ARGS=(--effort high)

# Jev decision client. Advice-only shadow mode is the safe credentialed default;
# active policy remains opt-in and is allowlisted by each later integration point.
if [[ -z "${LOOP_JEV_MODE:-}" ]]; then
  [[ -n "${TYPESAFE_API_KEY:-}" ]] && LOOP_JEV_MODE=shadow || LOOP_JEV_MODE=off
fi
case "$LOOP_JEV_MODE" in
  off|shadow|active) ;;
  *) LOOP_JEV_MODE=off ;;
esac
LOOP_JEV_ROUTE_MIN_CONFIDENCE="${LOOP_JEV_ROUTE_MIN_CONFIDENCE:-0.8}"
LOOP_JEV_QUESTION_MIN_CONFIDENCE="${LOOP_JEV_QUESTION_MIN_CONFIDENCE:-0.8}"
LOOP_JEV_MERGE_RISK_MIN_CONFIDENCE="${LOOP_JEV_MERGE_RISK_MIN_CONFIDENCE:-0.8}"
LOOP_JEV_TIMEOUT_MS="${LOOP_JEV_TIMEOUT_MS:-5000}"
export LOOP_JEV_MODE LOOP_JEV_ROUTE_MIN_CONFIDENCE LOOP_JEV_QUESTION_MIN_CONFIDENCE
export LOOP_JEV_MERGE_RISK_MIN_CONFIDENCE LOOP_JEV_TIMEOUT_MS
export LOOP_TASK_DEFAULT_PROFILE LOOP_TASK_LIGHT_PROFILE

LOOP_BUDGET_USD=15          # per attempt, claude legs only (codex has no budget flag)
LOOP_CHECKPOINT_SEC=1800    # 30m ceiling for one work/review attempt across model legs/retries
LOOP_TIMEOUT_TASK=1800      # 30m
LOOP_TIMEOUT_ESCALATE=1800  # 30m
LOOP_TIMEOUT_REVIEW=1800    # 30m
LOOP_TIMEOUT_REMEDIATE=1800 # 30m
LOOP_MAX_PARALLEL=3         # concurrent lanes (enforced by the orchestrator)

# Two-tier self-recycling orchestrator (loop-orchestrator.sh spawns disposable headless SUB
# instances; each self-measures its own context and recycles at a safe boundary). Trigger is
# absolute tokens, no hard-kill — see loop-protocol.md § Two-tier orchestration.
CHAIN_ORCHESTRATE=("claude:claude-opus-5-5")  # SUB instances: Opus 5.5
LOOP_ORCH_RECYCLE_TOKENS=150000  # SUB soft-handoff: recycle at the next safe boundary past this
LOOP_ORCH_CEILING_TOKENS=200000  # informational target ceiling (keeps the main chat under this)
LOOP_ORCH_BUDGET_USD=15          # per SUB instance (claude legs only)
LOOP_ORCH_STALL_SEC=1500         # SUB transcript mtime stale → kill pid tree + crash-respawn (25m)
LOOP_ORCH_MAX_RESPAWN=3          # consecutive-crash respawn cap, then notify + give up
LOOP_ORCH_CTX_WINDOW=1000000     # Opus 5.5 context window — UI occupancy % ONLY (trigger is absolute)
