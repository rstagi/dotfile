[package]
name = "ws-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem", "x509-parser"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
sha2 = "0.10"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
x509-parser = "0.18"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
