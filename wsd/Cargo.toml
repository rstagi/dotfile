[workspace]
members = ["crates/ws-core", "crates/ws-daemon", "crates/ws", "crates/ws-hub"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "process", "sync", "io-util"] }
ws-core = { path = "crates/ws-core" }
ws-daemon = { path = "crates/ws-daemon" }
ws-hub = { path = "crates/ws-hub" }
