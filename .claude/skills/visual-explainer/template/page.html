<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{TITLE}}</title>
<script>document.documentElement.classList.add("js");</script>
<style>
:root {
  color-scheme: light;
  --bg: #f5f3ee;
  --surface: #ffffff;
  --surface-2: #ecebe5;
  --ink: #1c1c1a;
  --ink-2: #57554e;
  --line: #d9d6cc;
  --accent: #2d5bd0;
  --ok: #1d8049;
  --warn: #a8660b;
  --bad: #bf2f25;
  --info: #5b4bc4;
  --muted: #7a776e;
  --code-bg: #efede6;
  --on-color: #ffffff;
  --shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 6px 20px rgb(0 0 0 / 5%);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111215;
    --surface: #1a1c21;
    --surface-2: #23262d;
    --ink: #ecebe6;
    --ink-2: #aeaca4;
    --line: #31343c;
    --accent: #7ea2ff;
    --ok: #4cc58a;
    --warn: #f0b155;
    --bad: #ff7466;
    --info: #ad98ff;
    --muted: #8d8b84;
    --code-bg: #15171b;
    --on-color: #111215;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111215;
  --surface: #1a1c21;
  --surface-2: #23262d;
  --ink: #ecebe6;
  --ink-2: #aeaca4;
  --line: #31343c;
  --accent: #7ea2ff;
  --ok: #4cc58a;
  --warn: #f0b155;
  --bad: #ff7466;
  --info: #ad98ff;
  --muted: #8d8b84;
  --code-bg: #15171b;
  --on-color: #111215;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
  overflow-wrap: anywhere;
}
a { color: var(--accent); }
code, pre { font-family: var(--mono); font-size: 0.88em; }
:not(pre) > code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 0.3em; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; }
p { margin: 0.4em 0; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

/* Hero */
.hero { padding: 48px 0 32px; border-bottom: 1px solid var(--line); }
.hero .wrap { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .hero .wrap { grid-template-columns: minmax(0, 1fr) auto; align-items: center; } }
.eyebrow { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; margin: 0 0 8px; }
h1 { font-size: clamp(2rem, 7vw, 3.2rem); letter-spacing: -0.02em; }
.subtitle { color: var(--ink-2); font-size: 1.1rem; margin-top: 12px; max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chips > * { flex: none; max-width: 100%; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 0.85rem; text-decoration: none; }
.chip-link { color: var(--accent); }
.chip.mono { font-family: var(--mono); }
.hero-aside { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.stat-col { display: grid; gap: 8px; justify-items: start; }
.stat-line { margin: 0; color: var(--ink-2); }
.stat-line b { color: var(--ink); font-size: 1.3rem; }

.ring { margin: 0; width: 132px; position: relative; }
.ring svg { width: 132px; height: 132px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring-track { stroke: var(--surface-2); }
.ring-value { stroke: var(--ok); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--pct)); }
.ring figcaption { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring figcaption b { font-size: 1.5rem; }
.ring figcaption span { font-size: 0.72rem; color: var(--ink-2); }

.strip { display: flex; flex-wrap: wrap; gap: 4px; max-width: 280px; }
.strip i { width: 14px; height: 14px; border-radius: 3px; background: var(--accent); opacity: 0.85; }
.strip i.gate { background: var(--warn); transform: rotate(45deg) scale(0.8); }
.strip i.sep { width: 2px; background: var(--line); }

/* Section navigation */
.toc { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.toc .wrap { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-top: 10px; padding-bottom: 10px; }
.toc a { white-space: nowrap; color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-radius: 999px; font-size: 0.9rem; }
.toc a:hover, .toc a.active { background: var(--surface-2); color: var(--ink); }
.play { margin-left: auto; flex: none; font: inherit; font-size: 0.9rem; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; }
.play[aria-pressed="true"] { background: transparent; color: var(--accent); }

/* Scenes */
main { padding: 8px 0 64px; }
.scene { padding: 40px 0 8px; }
.scene-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.kicker { font-family: var(--mono); color: var(--accent); font-size: 0.9rem; }
h2 { font-size: clamp(1.5rem, 4.5vw, 2rem); letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; margin: 18px 0 8px; }
.lead { font-size: 1.12rem; max-width: 70ch; }
.empty { color: var(--muted); font-style: italic; }
.label { margin: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); margin-top: 18px; }
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin-top: 0; }
.tag { display: inline-block; font-family: var(--mono); font-size: 0.78rem; color: var(--accent); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; margin-right: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Delivered */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.check { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.criterion { margin: 0; font-weight: 600; }
.result { margin: 2px 0 0; color: var(--ink-2); }
.icon { width: 26px; height: 26px; }
.icon circle { fill: none; stroke-width: 1.5; }
.icon path { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.icon-met circle, .icon-met path { stroke: var(--ok); }
.icon-partial circle, .icon-partial path { stroke: var(--warn); }
.icon-missed circle, .icon-missed path { stroke: var(--bad); }
.draw { stroke-dasharray: 1; stroke-dashoffset: 0; }

/* Deviations */
.deviation { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .deviation { grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); align-items: center; } .deviation .reason { grid-column: 1 / -1; } }
.arrow { width: 40px; height: 16px; justify-self: center; }
.arrow path { fill: none; stroke: var(--warn); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 639px) { .arrow { transform: rotate(90deg); } }
.reason { color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 8px; margin: 0; }

/* Setbacks and hiccups */
.stats { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-size: 1.4rem; line-height: 1.1; }
.stat span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
.setback { display: grid; gap: 4px; border-left: 4px solid var(--muted); }
.setback h3 { margin: 4px 0 0; }
.setback-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kind { font-size: 0.75rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; color: var(--on-color); background: var(--muted); }
.cost { font-family: var(--mono); font-size: 0.85rem; color: var(--ink-2); }
.resolution, .lesson { margin: 0; color: var(--ink-2); }
.lesson { border-top: 1px dashed var(--line); padding-top: 6px; }
:is(.kind-verify-fail, .kind-timeout, .kind-merge-conflict).kind { background: var(--bad); }
:is(.kind-retry, .kind-rate-limit, .kind-model-escalation, .kind-environment).kind { background: var(--warn); }
:is(.kind-question, .kind-hil, .kind-review-round, .kind-review-dispute, .kind-replan).kind { background: var(--info); }
:is(.kind-border-verify-fail, .kind-border-timeout, .kind-border-merge-conflict) { border-left-color: var(--bad); }
:is(.kind-border-retry, .kind-border-rate-limit, .kind-border-model-escalation, .kind-border-environment) { border-left-color: var(--warn); }
:is(.kind-border-question, .kind-border-hil, .kind-border-review-round, .kind-border-review-dispute, .kind-border-replan) { border-left-color: var(--info); }
@media (prefers-reduced-motion: no-preference) {
  .js .scene .stat { transition: opacity 0.5s ease calc(var(--i, 0) * 0.05s), transform 0.5s ease calc(var(--i, 0) * 0.05s); }
  .js .scene:not(.in) .stat { opacity: 0; transform: translateY(8px) scale(0.96); }
}

/* Review */
.review { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
.review-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.links { color: var(--ink-2); }
.verdict { display: inline-block; font-weight: 700; padding: 3px 12px; border-radius: 999px; color: var(--on-color); font-size: 0.9rem; }
.verdict-approve { background: var(--ok); }
.verdict-comment { background: var(--warn); }
.verdict-request-changes { background: var(--bad); }
.validation, .findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.validation li { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.note { color: var(--ink-2); }
.pill { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 8px; border-radius: 6px; border: 1px solid currentColor; }
.pill-pass, .pill-fixed { color: var(--ok); }
.pill-fail, .pill-open { color: var(--bad); }
.pill-skipped, .pill-deferred { color: var(--warn); }
.pill-high { color: var(--bad); }
.pill-medium { color: var(--warn); }
.pill-low { color: var(--ok); }
.bars { display: grid; gap: 6px; margin: 4px 0 14px; max-width: 520px; }
.bar-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 128px; gap: 10px; align-items: center; font-size: 0.85rem; }
.bar-label { color: var(--ink-2); }
.bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.grow { display: block; height: 100%; width: var(--w); border-radius: 5px; transform-origin: left; }
.bar-count small { color: var(--muted); }
.sev-blocker { background: var(--bad); }
.sev-major { background: var(--warn); }
.sev-minor { background: var(--info); }
.sev-nit { background: var(--muted); }
.sev-style { background: var(--line); }
.finding { border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 10px 14px; }
.finding.status-fixed { opacity: 0.72; }
.sev-border-blocker { border-left-color: var(--bad); }
.sev-border-major { border-left-color: var(--warn); }
.sev-border-minor { border-left-color: var(--info); }
.finding-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sev { color: var(--on-color); font-size: 0.75rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
.sev.sev-nit, .sev.sev-style { color: var(--ink); }
.fid { font-family: var(--mono); font-weight: 700; }
.finding-title { font-weight: 600; margin: 6px 0 0; }
.fix { color: var(--ink-2); }

/* Steps */
.steps { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 14px; }
.steps::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: var(--line); transform-origin: top; }
.step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; position: relative; }
.step-num { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-content: center; font-weight: 700; font-size: 0.9rem; z-index: 1; }
.rollback .step-num { background: var(--warn); }
.step-body { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.step-body h3 { margin: 0 0 8px; }
.cmd { position: relative; margin: 6px 0 8px; }
.cmd pre { margin: 0; padding: 12px 70px 12px 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.copy { position: absolute; top: 8px; right: 8px; font: inherit; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.ref { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin: 4px 0; }
.expect { color: var(--ink-2); }

/* Plan: architecture */
.arch { display: grid; gap: 0; margin-top: 18px; }
.layer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.layer-name { margin: 0 0 10px; }
.comps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.comp { border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.comp b { display: block; }
.comp .badge { display: inline-block; margin-top: 4px; }
.comp .role { display: block; margin-top: 4px; color: var(--ink-2); font-size: 0.9rem; }
.comp-new { border-top-color: var(--ok); }
.comp-changed { border-top-color: var(--warn); }
.comp-existing { border-top-color: var(--muted); }
.comp-removed { border-top-color: var(--bad); opacity: 0.75; }
.arch-link { display: block; width: 24px; height: 36px; margin: 0 auto; }
.arch-link path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 4; }
.flows { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
.flows li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flows .node { font-weight: 600; padding: 2px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.flows svg { width: 34px; height: 12px; }
.flows svg path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.flows svg path.flow { stroke-dasharray: 4 4; }
.flows .flow-label { color: var(--ink-2); }

/* Plan: timeline */
.milestone { margin-bottom: 26px; }
.ms-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin-bottom: 12px; }
.ms-num { font-family: var(--mono); font-weight: 700; color: var(--bg); background: var(--ink); border-radius: 6px; padding: 1px 8px; }
.ms-head p { flex-basis: 100%; color: var(--ink-2); margin: 0; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 12px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), var(--info)); transform-origin: top; }
.phase { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; position: relative; }
.dot { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); margin-top: 12px; z-index: 1; }
.kind-pr-review .dot { border-color: var(--warn); border-radius: 4px; transform: rotate(45deg) scale(0.85); }
.phase-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.phase-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
.num { font-family: var(--mono); font-weight: 700; color: var(--accent); }
.badge { font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.badge.gate { background: var(--warn); color: var(--bg); font-weight: 700; }
.phase-card h4 { font-size: 1rem; }
.done-when, .deps { color: var(--ink-2); font-size: 0.92rem; }

/* Plan: decisions and risks */
.decision h3 { margin: 0 0 6px; }
.rejected { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.rejected li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; color: var(--ink-2); }
.rejected svg { width: 16px; height: 16px; margin-top: 4px; }
.rejected svg path { fill: none; stroke: var(--bad); stroke-width: 2.4; stroke-linecap: round; }
.rejected b { color: var(--ink); }
.risk { display: grid; gap: 6px; border-left: 4px solid var(--muted); }
.risk.impact-high { border-left-color: var(--bad); }
.risk.impact-medium { border-left-color: var(--warn); }
.risk.impact-low { border-left-color: var(--ok); }
.risk-top { display: flex; flex-wrap: wrap; gap: 6px; }
.risk-title { font-weight: 600; margin: 0; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; padding: 18px 0 32px; }

/* Motion: only when the reader allows it and the script runs. The final state is the default. */
@media (prefers-reduced-motion: no-preference) {
  .js .scene { transition: opacity 0.6s ease, transform 0.6s ease; }
  .js .scene:not(.in) { opacity: 0; transform: translateY(18px); }
  .js .scene .draw { transition: stroke-dashoffset 0.6s ease calc(0.2s + var(--i, 0) * 0.07s); }
  .js .scene :is(.check, .step, .phase, .card, .layer) .draw { transition-delay: calc(0.3s + var(--i, 0) * 0.08s); }
  .js .scene:not(.in) .draw { stroke-dashoffset: 1; }
  .js .scene :is(.check, .step, .phase, .card, .bar-row, .layer) { transition: opacity 0.5s ease calc(var(--i, 0) * 0.06s), transform 0.5s ease calc(var(--i, 0) * 0.06s); }
  .js .scene:not(.in) :is(.check, .step, .phase, .card, .layer) { opacity: 0; transform: translateY(10px); }
  .js .grow { transition: transform 0.8s cubic-bezier(.2, .7, .2, 1) calc(0.2s + var(--i, 0) * 0.08s); }
  .js .scene:not(.in) .grow { transform: scaleX(0); }
  .js :is(.steps, .timeline)::before { transition: transform 1.2s ease 0.2s; }
  .js .scene:not(.in) :is(.steps, .timeline)::before { transform: scaleY(0); }
  .js .ring-value { transition: stroke-dashoffset 1.4s cubic-bezier(.2, .7, .2, 1) 0.3s; }
  .js:not(.ready) .ring-value { stroke-dashoffset: 100; }
  .js .strip i { animation: pop 0.4s ease both; animation-delay: calc(var(--i, 0) * 0.025s); }
  .arch-link path, .flows svg path.flow { animation: flow 1.1s linear infinite; }
  .scene.in .dot { animation: pulse 2.4s ease-out 1; }
}
@keyframes pop { from { opacity: 0; transform: scale(0.4); } }
@keyframes flow { to { stroke-dashoffset: -8; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
@media print {
  .toc { display: none; }
  .js .scene, .js .scene * { opacity: 1 !important; transform: none !important; }
}
</style>
</head>
<body class="mode-{{MODE}}">
<header class="hero"><div class="wrap">
{{HERO}}
</div></header>
{{VIDEO}}<nav class="toc" aria-label="Sections"><div class="wrap">{{NAV}}</div></nav>
<main><div class="wrap">
{{SCENES}}
</div></main>
<footer><div class="wrap">{{FOOTER}}</div></footer>
<script>
(function () {
  var root = document.documentElement;
  var scenes = Array.prototype.slice.call(document.querySelectorAll(".scene"));
  var links = Array.prototype.slice.call(document.querySelectorAll(".toc a"));
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add("ready"); }); });

  function show(el) { el.classList.add("in"); }
  if (reduce || !("IntersectionObserver" in window)) {
    scenes.forEach(show);
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    scenes.forEach(function (s) { io.observe(s); });
    window.addEventListener("beforeprint", function () { scenes.forEach(show); });
  }

  if ("IntersectionObserver" in window) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id); });
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    scenes.forEach(function (s) { spy.observe(s); });
  }

  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest && ev.target.closest("[data-copy]");
    if (!btn) return;
    var code = btn.parentNode.querySelector("code");
    if (!code || !navigator.clipboard) return;
    navigator.clipboard.writeText(code.textContent).then(function () {
      btn.textContent = "Copied";
      setTimeout(function () { btn.textContent = "Copy"; }, 1400);
    }, function () { btn.textContent = "Select"; });
  });

  var play = document.querySelector("[data-play]");
  var timer = null;
  function stop() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    play.setAttribute("aria-pressed", "false");
    play.textContent = "Play";
  }
  function go(i) {
    scenes[i].scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    show(scenes[i]);
  }
  if (play && scenes.length) {
    play.addEventListener("click", function () {
      if (timer) return stop();
      var i = 0;
      go(i);
      play.setAttribute("aria-pressed", "true");
      play.textContent = "Stop";
      timer = setInterval(function () { i += 1; if (i >= scenes.length) return stop(); go(i); }, 6500);
    });
    ["wheel", "touchstart", "keydown"].forEach(function (t) {
      window.addEventListener(t, function (e) { if (e.target !== play) stop(); }, { passive: true });
    });
  }
})();
</script>
</body>
</html>
