<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{TITLE}}</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #1f2328;
  --ink-2: #59636e;
  --muted: #818b98;
  --line: #d1d9e0;
  --line-2: #e8ebef;
  --accent: #0969da;
  --accent-bg: #ddf4ff;
  --accent-line: #b6dcff;
  --callout-bg: #f0f7ff;
  --code-bg: #eff1f3;
  --ok: #1a7f37;
  --ok-bg: #dafbe1;
  --ok-line: #8ddb9e;
  --warn: #9a6700;
  --warn-bg: #fff8c5;
  --warn-line: #e3c46b;
  --bad: #cf222e;
  --bad-bg: #ffebe9;
  --bad-line: #ffaba8;
  --orange: #bc4c00;
  --orange-bg: #fff1e5;
  --orange-line: #ffc38a;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #151b23;
    --surface-2: #1c232c;
    --ink: #e6edf3;
    --ink-2: #9ea7b3;
    --muted: #7d8590;
    --line: #3d444d;
    --line-2: #2a313b;
    --accent: #4493f8;
    --accent-bg: #142a45;
    --accent-line: #1f4b80;
    --callout-bg: #111f33;
    --code-bg: #262c36;
    --ok: #3fb950;
    --ok-bg: #12261e;
    --ok-line: #2a6a3a;
    --warn: #d29922;
    --warn-bg: #2a2111;
    --warn-line: #6b5216;
    --bad: #f85149;
    --bad-bg: #2d1316;
    --bad-line: #7a2a2a;
    --orange: #f0883e;
    --orange-bg: #2b1b0e;
    --orange-line: #7a4318;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1117;
  --surface: #151b23;
  --surface-2: #1c232c;
  --ink: #e6edf3;
  --ink-2: #9ea7b3;
  --muted: #7d8590;
  --line: #3d444d;
  --line-2: #2a313b;
  --accent: #4493f8;
  --accent-bg: #142a45;
  --accent-line: #1f4b80;
  --callout-bg: #111f33;
  --code-bg: #262c36;
  --ok: #3fb950;
  --ok-bg: #12261e;
  --ok-line: #2a6a3a;
  --warn: #d29922;
  --warn-bg: #2a2111;
  --warn-line: #6b5216;
  --bad: #f85149;
  --bad-bg: #2d1316;
  --bad-line: #7a2a2a;
  --orange: #f0883e;
  --orange-bg: #2b1b0e;
  --orange-line: #7a4318;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--sans);
  overflow-wrap: anywhere;
}
a { color: var(--accent); }
code, pre, .mono { font-family: var(--mono); }
code { font-size: 0.84em; background: var(--code-bg); padding: 0.12em 0.4em; border-radius: 5px; overflow-wrap: anywhere; }
pre { margin: 6px 0 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--ink-2); }

.page { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 32px 38px 36px; }

/* header */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; line-height: 1; padding: 5px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.mode { background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.01em; }
.sub { margin-top: 6px; color: var(--ink-2); font-size: 14px; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; font-size: 13.5px; color: var(--ink-2); }
.fact b { font-weight: 400; color: var(--muted); margin-right: 5px; }
.stat .add, .file .add { color: var(--ok); font-weight: 600; }
.stat .del, .file .del { color: var(--bad); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.pill.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }
.pill.info { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-line); }
.progress { display: inline-block; width: 120px; height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* TL;DR and callouts */
.tldr { margin-top: 22px; padding: 14px 18px 16px; background: var(--callout-bg); border: 1px solid var(--accent-line); border-left: 4px solid var(--accent); border-radius: 6px; }
.tldr .label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 6px; }
.tldr p + p { margin-top: 6px; }
.callout { padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 6px; }
.callout ol { margin: 0; padding-left: 20px; }
.callout li + li { margin-top: 10px; }

/* walkthrough: a spotlight on one section and a card with the commentary */
.wt-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 16px; }
.wt-start { font: 600 14px/1 var(--sans); color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
.wt-start:hover { filter: brightness(1.08); }
.wt-start:focus-visible, .wt-card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wt-hint { font-size: 13px; color: var(--ink-2); }
.shot .wt-bar { display: none; }
.wt-shade { position: fixed; inset: 0; z-index: 50; background: rgba(13, 17, 23, 0.55); }
.wt-shade.has-spot { background: transparent; }
.wt-spot { position: absolute; z-index: 51; border-radius: 10px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 200vmax rgba(13, 17, 23, 0.55); pointer-events: none; }
.wt-card { position: fixed; z-index: 52; width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25); font-size: 14.5px; line-height: 1.55; }
.wt-card .wt-step { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); text-transform: uppercase; }
.wt-card h2 { font-size: 16px; line-height: 1.3; margin: 4px 0 8px; }
.wt-card .wt-x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 18px; cursor: pointer; }
.wt-card .wt-x:hover { background: var(--surface-2); }
.wt-nav { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.wt-dots { flex: 1; display: flex; gap: 5px; }
.wt-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.wt-dots i.on { background: var(--accent); }
.wt-nav button { font: 600 13px/1 var(--sans); border-radius: 6px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.wt-nav button.wt-next { background: var(--accent); border-color: var(--accent); color: #fff; }
.wt-nav button[disabled] { opacity: 0.45; cursor: default; }
@media (prefers-reduced-motion: no-preference) {
  .wt-spot { transition: top 0.25s ease, left 0.25s ease, width 0.25s ease, height 0.25s ease; }
  .wt-card { transition: top 0.25s ease, left 0.25s ease; }
}

/* sections */
.sec { margin-top: 36px; }
.sec > h2 { font-size: 18px; line-height: 1.3; padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.sec > h2 .n { color: var(--muted); font-weight: 400; margin-right: 6px; }
h3.mini { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 18px 0 6px; }
h3.mini:first-of-type { margin-top: 0; }
.empty { color: var(--ink-2); }

/* tables: the box scrolls, never the page */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th + th, td + td { border-left: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
td.st { width: 1%; white-space: nowrap; }
.tbl.wide table { min-width: 640px; }

.tag { display: inline-block; font-size: 11.5px; line-height: 1.2; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.tag.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.tag.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.tag.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }
.tag.orange { color: var(--orange); background: var(--orange-bg); border-color: var(--orange-line); }
.tag.info { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-line); }

/* phases */
.phases { list-style: none; margin: 0; padding: 0; }
.ph { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); }
.ph:last-child { border-bottom: 0; }
.ph .box { flex: none; width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; transform: translateY(2px); }
.ph .what { flex: 1; min-width: 0; }
.ph .tag { margin-left: 6px; transform: translateY(-1px); }
.ph .est { flex: none; color: var(--ink-2); font-size: 13px; white-space: nowrap; }

/* diagrams */
.arch { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--panel-min)), 1fr)); gap: 14px;
  padding: 14px; border: 1px solid var(--line); border-radius: 8px; }
.arch-panel { margin: 0; min-width: 0; padding: 10px 0 4px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; overflow-x: auto; }
.arch-panel figcaption { font-size: 13px; font-weight: 600; padding: 0 14px 4px; }
.arch-svg, .seq { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--line); background: var(--surface); }
svg text { font-family: var(--sans); fill: var(--ink); }
.comp rect, .part rect { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
.comp .cn { font-size: 12.5px; font-weight: 600; }
.comp .cr { font-size: 10.5px; fill: var(--ink-2); }
.part text { font-size: 12px; font-weight: 600; }
.st-new rect, .sw.st-new { fill: var(--ok-bg); background: var(--ok-bg); stroke: var(--ok); border-color: var(--ok); }
.st-new .cr { fill: var(--ok); }
.st-changed rect, .sw.st-changed { fill: var(--warn-bg); background: var(--warn-bg); stroke: var(--warn); border-color: var(--warn); }
.st-changed .cr { fill: var(--warn); }
.st-removed rect, .sw.st-removed { fill: var(--bad-bg); background: var(--bad-bg); stroke: var(--bad); border-color: var(--bad); stroke-dasharray: 4 3; border-style: dashed; }
.st-removed .cn { text-decoration: line-through; }
.flow, .msg line, .msg path { fill: none; stroke: var(--ink-2); stroke-width: 1.2; }
.flow.fs-new { stroke: var(--ok); }
.flow.fs-removed { stroke: var(--bad); stroke-dasharray: 4 3; }
.ah { fill: var(--ink-2); stroke: none; }
.ah.fs-new { fill: var(--ok); }
.ah.fs-removed { fill: var(--bad); }
.life { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.msg text { font-size: 11.5px; fill: var(--ink-2); paint-order: stroke; stroke: var(--surface-2); stroke-width: 4px; stroke-linejoin: round; }
.msg.ret line { stroke-dasharray: 5 4; }
.seq-box { margin: 12px 0 4px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); overflow-x: auto; }

/* decisions */
.decisions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.dc { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; font-size: 14px; }
.dc h3 { font-size: 15px; margin-bottom: 10px; }
.dc .k { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-2); margin: 10px 0 2px; }
.dc .k:first-of-type { margin-top: 0; }
.dc s { color: var(--ink-2); }
.dc ul { margin: 0; padding: 0; list-style: none; }

ul.plain { margin: 0; padding-left: 20px; }
ul.plain li + li { margin-top: 4px; }

/* changes */
.changes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.chg { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.chg h3 { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.badge { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--surface); font-size: 12px; font-weight: 700; }
.chg .how { margin-top: 6px; font-size: 14.5px; }
.chg .why { margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
.files { margin-top: 10px; font-size: 12.5px; }
.file { display: flex; align-items: baseline; gap: 12px; padding: 3px 0; border-top: 1px solid var(--line-2); }
.file .p { flex: 1; min-width: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.file .note { font-family: var(--sans); color: var(--ink-2); }
.file .d { flex: none; font-family: var(--mono); white-space: nowrap; }

/* findings */
.findings { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.fd { border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; font-size: 14px; }
.fd-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.fd-top .t { flex: 1 1 220px; font-weight: 600; }
.fd-top .id { color: var(--muted); font-weight: 400; margin-right: 4px; }
.fd .loc { font-size: 12px; }
.fd p { margin-top: 4px; }
.fd .fix { color: var(--ink-2); font-size: 13.5px; }

/* hand test */
ol.steps { margin: 0; padding-left: 22px; }
ol.steps > li { padding-left: 4px; }
ol.steps > li + li { margin-top: 14px; }
.expect { margin-top: 6px; font-size: 14px; }
.ref { margin-top: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
ol.steps.compact > li + li { margin-top: 10px; }
ol.steps.compact pre { margin-top: 4px; padding: 7px 10px; font-size: 12.5px; }
.aside { margin-top: 4px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.aside .mono { font-size: 11.5px; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
details.more-rows { margin-top: 8px; }
details.more-rows > summary { cursor: pointer; font-size: 13.5px; color: var(--accent); padding: 4px 0; }
details.more-rows > .tbl { margin-top: 6px; }

/* media */
.figs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.fig { margin: 0; }
.fig img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
.fig figcaption { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.chg .figs { margin-top: 12px; }

/* full detail */
details.more { margin-top: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
details.more > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
details.more > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.more-body { padding: 4px 16px 18px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; font-size: 14px; }
.more-body h3 { font-size: 15px; margin: 20px 0 8px; }
.more-body h4 { font-size: 13.5px; margin: 14px 0 6px; color: var(--ink-2); }
.more-body table { font-size: 13px; }
.more-body p + p { margin-top: 6px; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dl.kv dt { color: var(--ink-2); }
dl.kv dd { margin: 0; min-width: 0; }
.graph-link { display: inline-block; margin-top: 20px; font-weight: 600; }
.foot { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }

@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .page { padding: 0 0 24px; }
  .card { border-radius: 0; border-left: 0; border-right: 0; border-top: 0; padding: 20px 16px 24px; }
  h1 { font-size: 23px; }
  .sec { margin-top: 30px; }
  .arch { padding: 8px; }
  .ph { flex-wrap: wrap; }
  .ph .est { margin-left: 24px; }
  .tbl.stack thead { display: none; }
  .tbl.stack tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tbl.stack tr:last-child { border-bottom: 0; }
  .tbl.stack td { display: block; width: auto; padding: 2px 12px; border: 0; }
  .tbl.stack td::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
}
@media (prefers-reduced-motion: no-preference) {
  details.more[open] > .more-body { animation: ve-in 0.18s ease-out; }
  @keyframes ve-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body class="mode-{{MODE}}">
<main class="page"><article class="card">
{{BODY}}
</article>
<p class="foot">visual-explainer · {{MODE}} · {{DATE}}</p>
</main>
{{WALKTHROUGH}}
</body>
</html>
